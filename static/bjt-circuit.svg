<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Tahoma, 'Noto Sans Thai', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
    <style>
      .wire { fill: none; stroke: #333; stroke-width: 2; }
      .lead { fill: none; stroke: #333; stroke-width: 2; }
      .dev { fill: none; stroke: #333; stroke-width: 2; }
      .node { fill: #333; }
      .label { font-size: 13px; fill: #113c60; }
      .value { font-size: 13px; font-weight: bold; fill: #b85c2c; }
      .current { font-size: 12px; font-weight: bold; fill: #178875; }
      .title { font-size: 17px; font-weight: bold; fill: #113c60; text-anchor: middle; }
      .subtitle { font-size: 12px; fill: #546d83; text-anchor: middle; }
    </style>
  </defs>

  <!-- ===== หัวข้อ ===== -->
  <text x="400" y="28" class="title">วงจรขยาย Common-Emitter แบบ Voltage-Divider Bias (NPN)</text>
  <text x="400" y="48" class="subtitle">Lab 03 · ENG29 2121 · แบบจำลอง Forward-Active (β และ VBE คงที่)</text>

  <!-- ===== ราง VCC ===== -->
  <line x1="90" y1="90" x2="710" y2="90" class="wire"/>
  <circle cx="180" cy="90" r="5" class="node"/>
  <circle cx="520" cy="90" r="5" class="node"/>
  <text x="90" y="80" class="label" text-anchor="start">VCC = 12 V</text>

  <!-- ===== R1: VCC ลงไปที่ Base (สาขาซ้าย) ===== -->
  <line x1="180" y1="90" x2="180" y2="110" class="wire"/>
  <rect x="170" y="110" width="20" height="60" class="dev"/>
  <line x1="180" y1="170" x2="180" y2="240" class="wire"/>
  <text x="152" y="136" class="value" text-anchor="end">R1</text>
  <text x="152" y="153" class="value" text-anchor="end">100 kΩ</text>

  <!-- ===== โหนด Base ===== -->
  <circle cx="180" cy="240" r="5" class="node"/>
  <text x="205" y="264" class="label">VB</text>
  <text x="250" y="230" class="current">IB →</text>

  <!-- ===== R2: Base ลงกราวด์ ===== -->
  <line x1="180" y1="240" x2="180" y2="270" class="wire"/>
  <rect x="170" y="270" width="20" height="60" class="dev"/>
  <line x1="180" y1="330" x2="180" y2="395" class="wire"/>
  <text x="152" y="296" class="value" text-anchor="end">R2</text>
  <text x="152" y="313" class="value" text-anchor="end">22 kΩ</text>
  <line x1="158" y1="395" x2="202" y2="395" class="wire"/>
  <line x1="166" y1="402" x2="194" y2="402" class="wire"/>
  <line x1="174" y1="409" x2="186" y2="409" class="wire"/>

  <!-- ===== สาย Base เข้าสู่ทรานซิสเตอร์ ===== -->
  <line x1="180" y1="240" x2="374" y2="240" class="wire"/>

  <!-- ===== สัญลักษณ์ BJT มาตรฐาน (วงกลมเดียว + แท่ง Base) ===== -->
  <circle cx="400" cy="250" r="44" class="dev"/>
  <line x1="374" y1="228" x2="374" y2="272" class="dev"/>

  <!-- ขา Collector -->
  <line x1="382" y1="234" x2="432" y2="190" class="lead"/>
  <line x1="432" y1="190" x2="520" y2="190" class="wire"/>

  <!-- ขา Emitter + ลูกศรออก (NPN) -->
  <line x1="382" y1="266" x2="432" y2="310" class="lead"/>
  <line x1="398" y1="280" x2="416" y2="295" class="lead" marker-end="url(#arrow)"/>
  <line x1="432" y1="310" x2="520" y2="310" class="wire"/>

  <!-- ===== RC: VCC ลงไปที่ Collector (สาขาขวา) ===== -->
  <line x1="520" y1="90" x2="520" y2="110" class="wire"/>
  <rect x="510" y="110" width="20" height="52" class="dev"/>
  <line x1="520" y1="162" x2="520" y2="190" class="wire"/>
  <circle cx="520" cy="190" r="5" class="node"/>
  <text x="548" y="130" class="value" text-anchor="start">RC</text>
  <text x="548" y="147" class="value" text-anchor="start">2.2 kΩ</text>

  <!-- ===== RE: Emitter ลงกราวด์ (คนละตำแหน่งกับกราวด์ R2) ===== -->
  <circle cx="520" cy="310" r="5" class="node"/>
  <line x1="520" y1="310" x2="520" y2="330" class="wire"/>
  <rect x="510" y="330" width="20" height="52" class="dev"/>
  <line x1="520" y1="382" x2="520" y2="405" class="wire"/>
  <text x="548" y="350" class="value" text-anchor="start">RE</text>
  <text x="548" y="367" class="value" text-anchor="start">1 kΩ</text>
  <line x1="498" y1="405" x2="542" y2="405" class="wire"/>
  <line x1="506" y1="412" x2="534" y2="412" class="wire"/>
  <line x1="514" y1="419" x2="526" y2="419" class="wire"/>

  <!-- ===== ป้ายแรงดันที่โหนด ===== -->
  <text x="495" y="178" class="label" text-anchor="end">VC</text>
  <text x="495" y="302" class="label" text-anchor="end">VE</text>

  <!-- ===== ป้ายทรานซิสเตอร์ (อยู่นอกวงกลม ด้านซ้าย) ===== -->
  <text x="336" y="264" class="label" text-anchor="end">Q1</text>
  <text x="336" y="281" class="label" text-anchor="end">NPN</text>
  <text x="336" y="298" class="value" text-anchor="end">β = 100</text>

  <!-- ===== ป้ายกระแส ===== -->
  <text x="548" y="184" class="current" text-anchor="start">IC ↓</text>
  <text x="548" y="398" class="current" text-anchor="start">IE ↓</text>

  <!-- ===== หมายเหตุล่าง ===== -->
  <text x="400" y="452" class="subtitle">ค่าความต้านทานในรูปเป็นค่าตัวอย่าง · ค่าที่ใช้คำนวณจริงตามที่กรอกในฟอร์ม</text>
</svg>
