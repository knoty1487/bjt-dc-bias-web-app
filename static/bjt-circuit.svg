<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Tahoma, 'Noto Sans Thai', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
    <style>
      .wire { fill: none; stroke: #333; stroke-width: 2; }
      .label { font-size: 13px; fill: #113c60; text-anchor: middle; }
      .value { font-size: 13px; font-weight: bold; fill: #b85c2c; text-anchor: middle; }
      .node { fill: #333; }
      .bjt-base { fill: none; stroke: #333; stroke-width: 2; }
      .bjt-emitter-collector { fill: none; stroke: #333; stroke-width: 2; }
      .bjt-arrow { fill: #333; stroke: #333; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: bold; fill: #113c60; text-anchor: middle; }
      .subtitle { font-size: 12px; fill: #546d83; text-anchor: middle; }
    </style>
  </defs>

  <!-- Title -->
  <text x="360" y="30" class="title">วงจรขยาย Common-Emitter แบบ Voltage-Divider Bias (NPN)</text>
  <text x="360" y="50" class="subtitle">Lab 02 · ENG29 2121 · VCC = 12 V · R1 = 100 kΩ · R2 = 22 kΩ · RC = 2.2 kΩ · RE = 1 kΩ · β = 100 · VBE = 0.70 V</text>

  <!-- VCC rail -->
  <line x1="80" y1="100" x2="640" y2="100" class="wire"/>
  <text x="80" y="120" class="label">VCC = 12 V</text>
  <text x="640" y="120" class="label">VCC = 12 V</text>

  <!-- R1: VCC to Base -->
  <line x1="80" y1="100" x2="200" y2="100" class="wire"/>
  <rect x="200" y="85" width="60" height="30" fill="none" stroke="#333" stroke-width="2"/>
  <text x="230" y="78" class="value">R1</text>
  <text x="230" y="102" class="value">100 kΩ</text>
  <line x1="260" y1="100" x2="260" y2="200" class="wire"/>

  <!-- R2: Base to Ground -->
  <line x1="260" y1="200" x2="260" y2="320" class="wire"/>
  <rect x="240" y="300" width="40" height="30" fill="none" stroke="#333" stroke-width="2" transform="rotate(90 260 315)"/>
  <text x="260" y="345" class="value">R2</text>
  <text x="260" y="362" class="value">22 kΩ</text>
  <line x1="260" y1="330" x2="300" y2="330" class="wire"/>

  <!-- Ground symbol at bottom of R2 -->
  <line x1="300" y1="330" x2="300" y2="350" class="wire"/>
  <line x1="280" y1="350" x2="320" y2="350" class="wire"/>
  <line x1="290" y1="355" x2="310" y2="355" class="wire"/>

  <!-- Base node -->
  <circle cx="260" cy="200" r="6" class="node"/>
  <text x="260" y="185" class="label">Base</text>

  <!-- RC: VCC to Collector -->
  <line x1="520" y1="100" x2="480" y2="100" class="wire"/>
  <rect x="440" y="85" width="60" height="30" fill="none" stroke="#333" stroke-width="2"/>
  <text x="470" y="78" class="value">RC</text>
  <text x="470" y="102" class="value">2.2 kΩ</text>
  <line x1="440" y1="100" x2="440" y2="220" class="wire"/>

  <!-- BJT -->
  <!-- Base connection -->
  <line x1="260" y1="200" x2="300" y2="220" class="wire"/>

  <!-- Collector -->
  <circle cx="440" cy="220" r="28" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="440" y1="220" x2="440" y2="248" class="wire"/>

  <!-- Emitter -->
  <circle cx="300" cy="300" r="28" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="300" x2="300" y2="328" class="wire"/>

  <!-- RE: Emitter to Ground -->
  <line x1="300" y1="328" x2="300" y2="350" class="wire"/>
  <rect x="280" y="330" width="40" height="30" fill="none" stroke="#333" stroke-width="2" transform="rotate(90 300 345)"/>
  <text x="300" y="375" class="value">RE</text>
  <text x="300" y="392" class="value">1 kΩ</text>

  <!-- Ground symbol at RE -->
  <line x1="300" y1="392" x2="300" y2="412" class="wire"/>
  <line x1="280" y1="412" x2="320" y2="412" class="wire"/>
  <line x1="290" y1="417" x2="310" y2="417" class="wire"/>

  <!-- BJT labels -->
  <text x="340" y="210" class="label">Q1</text>
  <text x="340" y="228" class="label">NPN</text>
  <text x="340" y="246" class="value">β = 100</text>

  <!-- Voltage labels -->
  <text x="420" y="185" class="label">VC</text>
  <text x="300" y="360" class="label">VE</text>
  <text x="280" y="215" class="label">VB</text>

  <!-- Arrows for current -->
  <text x="540" y="220" class="label">IC ↓</text>
  <text x="360" y="315" class="label">IE ↓</text>

  <!-- Notes -->
  <text x="360" y="390" class="subtitle">แบบจำลอง Forward-Active (β และ VBE คงที่)</text>
</svg>
