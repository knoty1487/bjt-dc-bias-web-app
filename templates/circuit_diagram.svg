<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Arial, sans-serif">
  <defs>
    <style>
      .wire { fill: none; stroke: #113c60; stroke-width: 2; }
      .resistor { fill: none; stroke: #113c60; stroke-width: 2; }
      .bjt { fill: none; stroke: #113c60; stroke-width: 2; }
      .bjt-arrow { fill: #113c60; stroke: #113c60; stroke-width: 1.5; }
      .node { fill: #113c60; }
      .ground-line { fill: none; stroke: #113c60; stroke-width: 2; }
      .label { font-size: 12px; fill: #24455f; text-anchor: middle; }
      .value { font-size: 12px; font-weight: bold; fill: #b85c2c; text-anchor: middle; }
      .title { font-size: 14px; font-weight: bold; fill: #113c60; text-anchor: middle; }
      .region { font-size: 12px; font-weight: bold; text-anchor: middle; }
      .region-active { fill: #178875; }
      .region-cutoff, .region-sat { fill: #b3261e; }
    </style>
  </defs>

  <!-- Title -->
  <text x="350" y="24" class="title">วงจรขยาย Common-Emitter แบบ Voltage-Divider Bias (จำลอง DC)</text>

  <!-- VCC rail -->
  <line x1="70" y1="95" x2="630" y2="95" class="wire"/>
  <text x="70" y="115" class="label">VCC</text>
  <text x="70" y="132" class="value">{{ "%.2f"|format(values.vcc|float) }} V</text>
  <text x="630" y="115" class="label">VCC</text>
  <text x="630" y="132" class="value">{{ "%.2f"|format(values.vcc|float) }} V</text>

  <!-- R1: VCC to Base -->
  <line x1="70" y1="95" x2="190" y2="95" class="wire"/>
  <rect x="190" y="80" width="60" height="30" class="resistor"/>
  <text x="220" y="74" class="value">R1</text>
  <text x="220" y="98" class="value">{{ resistors.r1|float|round(1)|float }} Ω</text>
  <line x1="250" y1="95" x2="250" y2="190" class="wire"/>

  <!-- R2: Base to Ground -->
  <line x1="250" y1="190" x2="250" y2="310" class="wire"/>
  <rect x="230" y="290" width="40" height="30" class="resistor" transform="rotate(90 250 305)"/>
  <text x="250" y="335" class="value">R2</text>
  <text x="250" y="352" class="value">{{ resistors.r2|float|round(1)|float }} Ω</text>
  <line x1="250" y1="320" x2="290" y2="320" class="wire"/>

  <!-- Ground at R2 -->
  <line x1="290" y1="320" x2="290" y2="340" class="ground-line"/>
  <line x1="270" y1="340" x2="310" y2="340" class="ground-line"/>
  <line x1="280" y1="345" x2="300" y2="345" class="ground-line"/>

  <!-- Base node -->
  <circle cx="250" cy="190" r="5" class="node"/>
  <text x="250" y="175" class="label">Base</text>

  <!-- RC: VCC to Collector -->
  <line x1="510" y1="95" x2="470" y2="95" class="wire"/>
  <rect x="430" y="80" width="60" height="30" class="resistor"/>
  <text x="460" y="74" class="value">RC</text>
  <text x="460" y="98" class="value">{{ resistors.rc|float|round(1)|float }} Ω</text>
  <line x1="430" y1="95" x2="430" y2="210" class="wire"/>

  <!-- BJT -->
  <circle cx="430" cy="210" r="26" class="bjt"/>
  <line x1="430" y1="210" x2="430" y2="238" class="wire"/>
  <line x1="250" y1="190" x2="390" y2="210" class="wire"/>

  <!-- Emitter -->
  <circle cx="290" cy="290" r="26" class="bjt"/>
  <line x1="290" y1="290" x2="290" y2="318" class="wire"/>

  <!-- RE: Emitter to Ground -->
  <line x1="290" y1="318" x2="290" y2="340" class="wire"/>
  <rect x="270" y="320" width="40" height="30" class="resistor" transform="rotate(90 290 335)"/>
  <text x="290" y="365" class="value">RE</text>
  <text x="290" y="382" class="value">{{ resistors.re|float|round(1)|float }} Ω</text>

  <!-- Ground at RE -->
  <line x1="290" y1="382" x2="290" y2="402" class="ground-line"/>
  <line x1="270" y1="402" x2="310" y2="402" class="ground-line"/>
  <line x1="280" y1="407" x2="300" y2="407" class="ground-line"/>

  <!-- BJT labels -->
  <text x="330" y="200" class="label">Q1 NPN</text>
  <text x="330" y="218" class="value">β = {{ values.beta }}</text>
  <text x="330" y="236" class="value">VBE = {{ values.vbe }} V</text>

  <!-- Voltage labels on nodes -->
  <text x="410" y="180" class="label">VC</text>
  <text x="410" y="197" class="value">{{ "%.2f"|format(result.vc) }} V</text>

  <text x="270" y="350" class="label">VE</text>
  <text x="270" y="367" class="value">{{ "%.2f"|format(result.ve) }} V</text>

  <text x="230" y="205" class="label">VB</text>
  <text x="230" y="222" class="value">{{ "%.2f"|format(result.vb) }} V</text>

  <!-- Current labels -->
  <text x="530" y="210" class="label">IC</text>
  <text x="530" y="227" class="value">{{ "%.2f"|format(result.ic * 1000) }} mA</text>
  <text x="350" y="305" class="label">IE</text>
  <text x="350" y="322" class="value">{{ "%.2f"|format(result.ie * 1000) }} mA</text>
  <text x="230" y="250" class="label">IB</text>
  <text x="230" y="267" class="value">{{ "%.2f"|format(result.ib * 1e6) }} µA</text>

  <!-- VCE arrow label -->
  <line x1="430" y1="210" x2="430" y2="290" stroke="#113c60" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="450" y="250" class="label">VCE</text>
  <text x="450" y="267" class="value">{{ "%.2f"|format(result.vce) }} V</text>

  <!-- Region badge -->
  {% set region_class = 'region-active' if result.region == 'active' else 'region-cutoff' if result.region == 'cutoff' else 'region-sat' %}
  <rect x="500" y="340" width="180" height="38" rx="6" fill="#f7faff" stroke="#113c60" stroke-width="1.5"/>
  <text x="590" y="360" class="{{ region_class }}">{{ "สภาวะ: " + result.region|upper }}</text>

</svg>
